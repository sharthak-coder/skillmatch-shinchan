  <ellipse cx="38" cy="47" rx="4" ry="5.5" fill="#1E293B"/>
  <circle cx="39" cy="45" r="1.5" fill="#FFFFFF"/>

  <ellipse cx="62" cy="47" rx="4" ry="5.5" fill="#1E293B"/>
