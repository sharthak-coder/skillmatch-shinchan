  <!-- Blue Collar -->
  <path d="M 32 76 Q 50 84 68 76 L 70 82 Q 50 90 30 82 Z" fill="#0284C7" stroke="#1E293B" stroke-width="2.5"/>
  <circle cx="50" cy="84" r="3.5" fill="#FACC15" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Floppy Puppy Ears -->
  <ellipse cx="22" cy="48" rx="8" ry="14" fill="#FFFFFF" stroke="#1E293B" stroke-width="3.5" transform="rotate(-15, 22, 48)"/>
  <ellipse cx="78" cy="48" rx="8" ry="14" fill="#FFFFFF" stroke="#1E293B" stroke-width="3.5" transform="rotate(15, 78, 48)"/>

  <!-- Fluffy White Head -->
